<html>
<head>
    <title>Pendaftaran</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="kotak">
    <div id="hasil">
        Data anda harus ditampilkan di sini...
    </div>

    <h2>Forum pembelanjaan</h2>

    <form id="formku">
        <label>Nama lengkap:</label>
        <input type="text" id="nama" placeholder="contoh: Siti aisyah">

        <label>Jenis Kelamin:</label>
        <div class="kotak3">
            <label>
                <input type="radio" name="gender" value="Laki-laki"> Laki-laki
            </label>
            <label>
                <input type="radio" name="gender" value="Perempuan"> Perempuan
            </label>
        </div>

        <label>Belanjaan yang dibeli:</label>
        <div class="kotak3">
            <input type="text" id="belanjaan" placeholder="contoh: Buku, Pensil">
        </div>

        <label>Metode pembayaran:</label>
        <div class="kotak4">
            <label>
                <input type="radio" name="hari" value="Credit"> Credit
            </label>
            <label>
                <input type="radio" name="hari" value="Debit"> Debit
            </label>
            <label>
                <input type="radio" name="hari" value="Gopay"> Gopay
            </label>
            <label>
                <input type="radio" name="hari" value="Dana"> Dana
            </label>
        </div>

        <div class="actions">
            <button type="button" onclick="tampil()">Daftar sekarang</button>
            <button type="button" onclick="resetForm()">Reset Form</button>
        </div>
    </form>
</div>

<script src="script.js"></script>
</body>
</html>
